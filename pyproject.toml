[project]
name = "gigbid"
version = "0.1.0"
description = "GigBid: agentic freelance bidding assistant (AI-4016 A2)"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.162.4",
  "uvicorn[standard]==0.54.0",
  "pydantic==2.14.3",
  "pyyaml==6.0.3",
  "langgraph==1.2.20",
  "langgraph-checkpoint-sqlite==3.1.3",
  "langgraph-checkpoint-postgres==3.2.0",
  "langgraph-supervisor==0.0.31",
  "langchain-core==1.7.7",
  "langchain-ollama==1.1.0",
  "langchain-openai==1.7.4",
  "langchain-mcp-adapters==0.3.2",
  "langsmith==0.14.17",
  "mcp==1.30.0",
  "httpx==0.28.1",
  "python-dotenv==1.2.4",
  "rank-bm25==0.2.2",
  "numpy==2.5.4",
  "pandas==3.1.1",
  "scikit-learn==1.9.1",
  "scipy==1.18.1",
  "fastembed==0.9.1",
  "psycopg[binary]==3.3.8",
  "redis==5.3.1",
  "arq==0.28.0",
  "cryptography==50.0.2",
  "pyjwt==2.15.1",
  "sse-starlette==3.7.0",
]

[project.optional-dependencies]
dev = ["pytest==9.2.0", "pytest-asyncio==1.4.1.post1", "ruff==0.17.4", "fakeredis==2.40.0", "kaggle"]

[project.scripts]
gigbid-portfolio-mcp = "mcp_servers.portfolio.server:main"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Style rules from the stricter ruff 0.17 defaults. Reviewed one by one: the flagged code is intentional
# (best effort fallbacks that must not crash, NaN checks, subprocess calls whose failure is handled) and is
# not worth rewriting under a deadline.
ignore = ["BLE001", "S110", "PLW1510", "C408", "RUF046", "RUF059", "RUF012", "RUF017", "SIM113", "ISC004",
          "PLR0124", "PLW1508"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
testpaths = ["tests", "mcp_servers"]

[tool.setuptools.packages.find]
include = ["agent*", "apps*", "rag*", "mcp_servers*", "gigsim*", "evals*", "worker*"]
