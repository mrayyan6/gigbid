profile: open
profiles:
  open:
    cheap: ollama/qwen2.5:7b-instruct
    strong: ollama/llama3.1:8b
    embedding: nomic-embed-text
    reranker: bge-reranker-v2-m3
  paid: {}
llm:
  enabled: false   # true routes writer/critic to Ollama; false uses deterministic templates
  ollama_url: http://localhost:11434
budgets:
  max_steps_per_thread: 40
  max_tokens_per_thread: 60000
  critic_max_revisions: 2
decision:
  risk_skip: 0.6
  fit_bid: 0.5
  fit_watch: 0.25
pricing:
  band_low: 0.8
  band_high: 1.3
  target_position: 0.5     # 0 = band low, 1 = band high
  max_connects_per_proposal: 12
compliance:
  banned_phrases: ["guarantee", "100% success", "telegram", "whatsapp", "pay me outside", "10 years"]
  max_words: 220
risk:
  patterns:
    off_platform: ["telegram", "whatsapp", "outside the platform", "off-platform", "skype"]
    unpaid: ["unpaid", "free as a test", "for free", "registration fee"]
    injection: ["ignore all previous", "ignore previous instructions", "system:", "admin mode",
                "reveal your system prompt", "ai assistants reading"]
    payment_fraud: ["bank login", "guaranteed 10x"]
api:
  jwt_ttl_minutes: 720
  pbkdf2_iterations: 200000
  checkpoint_db: data/processed/checkpoints.sqlite
  users_db: data/processed/users.sqlite
  health_probe_timeout_s: 2.0
  stream_poll_interval_s: 0.4
  stream_max_seconds: 120
  default_settings:
    autonomy: manual            # manual | auto_skip_low_fit (never auto-sends)
    weekly_connects_budget: 100
    min_hourly_rate: 25
    keywords: []
    saved_searches: []
pipeline:
  stages: [drafted, submitted, viewed, replied, interview, hired, lost]
worker:
  gigsim_scout_interval_minutes: 30
  live_scout_interval_minutes: 120   # live mode: conservative, a few reads per hour, no scraping-like polling
  processed_ttl_seconds: 604800
  max_jobs_per_scout: 10
  job_timeout_seconds: 300
