name: ci

# NOTE: these workflows are disabled in the GitHub repo settings (Actions tab) until the owner
# enables them on purpose. Do not enable them casually: every failing run sends an email.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.13"
  NODE_VERSION: "20"
  GIGBID_TEST_MODE: "1"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install ruff
        run: pip install "ruff==0.17.4"
      - name: Ruff
        run: ruff check .

  repo-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install PyYAML (the script only needs the standard library and git)
        run: pip install pyyaml
      - name: Secrets, gigsim manifest, inline prompts, results numbers
        run: python scripts/check_repo.py

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: pip install -e ".[dev]"
      - name: Generate GigSim data (fresh clone rule, data/processed is git-ignored)
        run: python -m gigsim.generate
      - name: Unit, integration and contract tests
        run: python -m pytest -q

  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install Python deps
        run: pip install -e ".[dev]"
      - name: Point .venv/Scripts/python at the CI interpreter (playwright.config.ts expects it)
        run: |
          mkdir -p .venv/Scripts
          ln -sf "$(command -v python)" .venv/Scripts/python
      - name: Generate GigSim data
        run: python -m gigsim.generate
      - name: Install web deps and build
        working-directory: apps/web
        run: |
          npm install -g npm@11.6.1  # the lock file was written by npm 11, Node 20 ships npm 10
          npm ci
          npm run build
      - name: Install Playwright browser
        working-directory: apps/web
        run: npx playwright install --with-deps chromium
      - name: Run end to end tests (playwright.config.ts starts GigSim, API and web)
        working-directory: apps/web
        run: npx playwright test
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report
          if-no-files-found: ignore
          retention-days: 7
